<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ an_actual_token }}">
    <script
      src="https://js-de.sentry-cdn.com/6604be417c099671b7ee6e98970c90d6.min.js"
      crossorigin="anonymous"
    ></script>
    <title>Financial Reports - Massage Shop POS</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        .admin-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .admin-nav .btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            color: #495057;
        }
        
        .admin-nav .btn.active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .summary-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .summary-card[role="button"],
        .report-item[role="button"],
        .report-section[role="button"] {
            cursor: pointer;
        }

        .summary-card.is-open,
        .report-item.is-open,
        .report-section.is-open {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.16);
            background: #eaf4ff;
        }

        .report-tile-dimmed {
            opacity: 0.42;
        }
        
        .summary-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        
        .summary-card .label {
            color: #6c757d;
            font-size: 14px;
        }
        
        .filter-controls {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .filter-controls h3 {
            margin: 0 0 15px 0;
            color: #495057;
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            align-items: end;
        }
        
        .time-period-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
        }
        
        .time-period-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            color: #6c757d;
            transition: all 0.3s ease;
        }
        
        .time-period-tab.active {
            color: #007bff;
            border-bottom-color: #007bff;
            background: #f8f9fa;
        }
        
        .time-period-tab:hover {
            background: #f8f9fa;
            color: #007bff;
        }
        
        .reports-container {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .reports-container h3 {
            margin: 0 0 15px 0;
            color: #495057;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }
        
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .report-section {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }
        
        .report-section h4 {
            margin: 0 0 10px 0;
            color: #495057;
            font-size: 16px;
        }
        
        .report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .report-item:last-child {
            border-bottom: none;
        }
        
        .report-item .label {
            color: #6c757d;
            font-size: 14px;
        }
        
        .report-item .value {
            font-weight: bold;
            color: #495057;
        }
        
        .report-item .value.positive {
            color: #28a745;
        }
        
        .report-item .value.negative {
            color: #dc3545;
        }

        .report-detail-panel {
            grid-column: 1 / -1;
            background: #f8fbff;
            border: 1px solid #cfe2ff;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }

        .report-detail-panel h4 {
            margin: 0 0 10px 0;
        }

        .report-detail-table {
            border-collapse: collapse;
            width: 100%;
        }

        .report-detail-table th,
        .report-detail-table td {
            border-bottom: 1px solid #dbe3ef;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        .report-detail-table th {
            background: #edf4ff;
            color: #334155;
            font-size: 12px;
        }

        .report-detail-total-row td {
            background: #f8fafc;
            font-weight: 800;
        }
        
        .chart-container {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-placeholder {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .chart-placeholder h4 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        
        .export-controls {
            text-align: center;
            margin-top: 20px;
        }
        
        .export-controls .btn {
            margin: 0 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Admin Header -->
        <div class="admin-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="margin: 0; margin-bottom: 5px;">📊 Financial Reports & Analytics</h1>
                    <p style="margin: 0; opacity: 0.9;">View financial breakdowns and performance metrics (Manager Only)</p>
                </div>
                <div class="user-info" id="user-info" style="display: flex; align-items: center; gap: 10px;">
                    <span id="current-user" style="color: rgba(255,255,255,0.9); font-size: 14px;"></span>
                    <button onclick="logout()" class="btn" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">
                <span class="label-th">👋 ออกจากระบบ</span>
                <span class="label-en">👋 Logout</span>
            </button>
                </div>
            </div>
        </div>

        <!-- Admin Navigation -->
        <div class="admin-nav">
            <button class="btn" onclick="window.location.href='/api/admin/staff-page'">
                <span class="label-th">💰 ติดตามการจ่ายเงิน</span>
                <span class="label-en">💰 Payday Tracking</span>
            </button>
            <button class="btn" onclick="window.location.href='/api/admin/services-page'">
                <span class="label-th">💰 บริการและราคา</span>
                <span class="label-en">💰 Services & Pricing</span>
            </button>
            <button class="btn active">
                <span class="label-th">📊 รายงานการเงิน</span>
                <span class="label-en">📊 Financial Reports</span>
            </button>
            <button class="btn" onclick="window.location.href='/api/admin/payment-types-page'">
                <span class="label-th">💳 ประเภทการชำระเงิน</span>
                <span class="label-en">💳 Payment Types</span>
            </button>

            <button class="btn" onclick="window.location.href='/'">
                <span class="label-th">🏠 กลับไปหน้าแรก</span>
                <span class="label-en">🏠 Back to Dashboard</span>
            </button>
        </div>

        <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="summary-card" role="button" tabindex="0" data-report-summary-card="total-revenue" aria-expanded="false">
                    <div class="value" id="total-revenue">-</div>
                    <div class="label">Total Revenue</div>
                </div>
                <div class="summary-card" role="button" tabindex="0" data-report-summary-card="total-transactions" aria-expanded="false">
                    <div class="value" id="total-transactions">-</div>
                    <div class="label">Total Transactions</div>
                </div>
                <div class="summary-card" role="button" tabindex="0" data-report-summary-card="average-transaction" aria-expanded="false">
                    <div class="value" id="avg-transaction">-</div>
                    <div class="label">Average Transaction</div>
                </div>
                <div class="summary-card" role="button" tabindex="0" data-report-summary-card="total-fees" aria-expanded="false">
                    <div class="value" id="total-fees">-</div>
                    <div class="label">Total Masseuse Fees</div>
                </div>
                <div class="summary-card" role="button" tabindex="0" data-report-summary-card="net-profit" aria-expanded="false">
                    <div class="value" id="net-profit">-</div>
                    <div class="label">Net Profit</div>
                </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <h3>🔍 Filter & Date Range</h3>
            <div class="filter-row">
                <div class="form-group">
                    <label for="date-from">From Date:</label>
                    <input type="date" id="date-from" onchange="loadReports()">
                </div>
                <div class="form-group">
                    <label for="date-to">To Date:</label>
                    <input type="date" id="date-to" onchange="loadReports()">
                </div>
                <div class="form-group">
                    <label for="filter-staff">Staff Member:</label>
                    <select id="filter-staff" onchange="loadReports()">
                        <option value="">All Staff</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter-service">Service Type:</label>
                    <select id="filter-service" onchange="loadReports()">
                        <option value="">All Services</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filter-location">Location:</label>
                    <select id="filter-location" onchange="loadReports()">
                        <option value="">All Locations</option>
                        <option value="In-Shop">In-Shop</option>
                        <option value="Home Service">Home Service</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Time Period Tabs -->
        <div class="time-period-tabs">
            <button class="time-period-tab active" onclick="setTimePeriod('today', this)">Today</button>
            <button class="time-period-tab" onclick="setTimePeriod('week', this)">This Week</button>
            <button class="time-period-tab" onclick="setTimePeriod('month', this)">This Month</button>
            <button class="time-period-tab" onclick="setTimePeriod('year', this)">This Year</button>
            <button class="time-period-tab" onclick="setTimePeriod('custom', this)">Custom Range</button>
        </div>

        <!-- Reports Container -->
        <div id="reports-container">
            <div class="loading">Select a date range to view financial reports</div>
        </div>
        
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading" style="display: none;">
            Loading financial reports...
        </div>
        
        <!-- Financial Summary Container -->
        <div id="financial-summary" style="display: none;">
            <!-- Will be populated by JavaScript -->
        </div>
        
        <!-- Reports Table Container -->
        <div id="reports-table" style="display: none;">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Export Controls -->
        <div class="export-controls">
            <button class="btn" onclick="exportReport('csv')">📊 Export to CSV</button>
            <button class="btn" onclick="printReport()">🖨️ Print Report</button>
        </div>
    </div>

    <script src="/api.js"></script>
    <script src="/shared.js"></script>
    <script>
        let currentTimePeriod = 'today';
        let currentReports = null;

        function escapeReportHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Check authentication
        function checkAuth() {
            // For now, just ensure the page loads
            // In a real implementation, this would check if user is logged in and has manager role
            console.log('Auth check passed - loading admin reports page');
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            renderCurrentUser();
            initializeFilters();
            setupReportTileToggles();
            // Don't call setTimePeriod immediately - let user choose
        });

        function setupReportTileToggles(scope = document) {
            scope.querySelectorAll('[data-report-summary-card], [data-report-tile]').forEach(tile => {
                if (tile.dataset.reportToggleBound === 'true') return;
                tile.dataset.reportToggleBound = 'true';
                tile.addEventListener('click', () => {
                    const tileKey = tile.dataset.reportSummaryCard || tile.dataset.reportTile;
                    toggleReportTileDetail(tileKey, tile);
                });
                tile.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        const tileKey = tile.dataset.reportSummaryCard || tile.dataset.reportTile;
                        toggleReportTileDetail(tileKey, tile);
                    }
                });
            });
        }

        function toggleReportTileDetail(tileKey, tile) {
            if (!currentReports || !tileKey || !tile) return;

            const existing = tile.nextElementSibling;
            if (existing && existing.classList.contains('report-detail-panel')) {
                existing.remove();
                clearReportTileSelection();
                return;
            }

            document.querySelectorAll('.report-detail-panel').forEach(panel => panel.remove());
            clearReportTileSelection();

            const detail = document.createElement('div');
            detail.className = 'report-detail-panel';
            detail.innerHTML = renderReportTileDetailTable(tileKey);
            tile.insertAdjacentElement('afterend', detail);

            const group = tile.closest('.summary-cards, .report-grid');
            if (group) {
                group.querySelectorAll('[data-report-summary-card], [data-report-tile]').forEach(peer => {
                    if (peer !== tile) peer.classList.add('report-tile-dimmed');
                });
            }
            tile.classList.add('is-open');
            tile.setAttribute('aria-expanded', 'true');
        }

        function clearReportTileSelection() {
            document.querySelectorAll('[data-report-summary-card], [data-report-tile]').forEach(tile => {
                tile.classList.remove('is-open', 'report-tile-dimmed');
                tile.setAttribute('aria-expanded', 'false');
            });
        }

        // Initialize filter dropdowns
        async function initializeFilters() {
            try {
                const [staff, serviceTypes, locations] = await Promise.all([
                    api.getReportStaff(),
                    api.getReportServiceTypes(),
                    api.getReportLocations()
                ]);

                const staffSelect = document.getElementById('filter-staff');
                staff.forEach(member => {
                    const option = document.createElement('option');
                    option.value = member;
                    option.textContent = member;
                    staffSelect.appendChild(option);
                });

                const serviceSelect = document.getElementById('filter-service');
                serviceTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    serviceSelect.appendChild(option);
                });

                const locationSelect = document.getElementById('filter-location');
                locationSelect.innerHTML = '<option value="">All Locations</option>';
                locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    locationSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error initializing filters:', error);
            }
        }

        // Set time period and load reports
        function setTimePeriod(period, clickedTab = null) {
            currentTimePeriod = period;
            
            // Update active tab
            document.querySelectorAll('.time-period-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (clickedTab) {
                clickedTab.classList.add('active');
            }
            
            // Set date range based on period
            const today = new Date();
            let fromDate, toDate;
            
            switch (period) {
                case 'today':
                    fromDate = today;
                    toDate = today;
                    break;
                case 'week':
                    fromDate = new Date(today.getTime() - (today.getDay() * 24 * 60 * 60 * 1000));
                    toDate = today;
                    break;
                case 'month':
                    fromDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    toDate = today;
                    break;
                case 'year':
                    fromDate = new Date(today.getFullYear(), 0, 1);
                    toDate = today;
                    break;
                case 'custom':
                    // Keep current custom dates
                    return;
            }
            
            document.getElementById('date-from').value = fromDate.toISOString().split('T')[0];
            document.getElementById('date-to').value = toDate.toISOString().split('T')[0];
            
            // Add a small delay to ensure DOM is ready, then load reports
            setTimeout(() => {
                loadReports();
            }, 100);
        }

        // Load financial reports
        async function loadReports() {
            console.log('🚀 loadReports() called');
            
            const fromDate = document.getElementById('date-from').value;
            const toDate = document.getElementById('date-to').value;
            const staffId = document.getElementById('filter-staff').value;
            const serviceType = document.getElementById('filter-service').value;
            const location = document.getElementById('filter-location').value;

            console.log('📅 Date values:', { fromDate, toDate, staffId, serviceType, location });

            if (!fromDate || !toDate) {
                console.log('❌ Missing dates, returning early');
                showToast('Please select both start and end dates', 'error');
                return;
            }

            try {
                console.log('🔄 Starting API call...');
                
                // Show loading
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('reports-container').style.display = 'none';
                document.getElementById('financial-summary').style.display = 'none';
                document.getElementById('reports-table').style.display = 'none';

                // Build query parameters
                const params = new URLSearchParams({
                    from_date: fromDate,
                    to_date: toDate
                });
                
                if (staffId && staffId !== 'all') params.append('staff_member', staffId);
                if (serviceType && serviceType !== 'all') params.append('service_type', serviceType);
                if (location && location !== 'all') params.append('location', location);

                console.log('📡 Loading financial report with params:', params.toString());
                currentReports = await api.getFinancialReport({
                    from_date: fromDate,
                    to_date: toDate,
                    staff_member: staffId,
                    service_type: serviceType,
                    location
                });
                console.log('✅ API response received:', currentReports);
                displayReports();
            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-container').innerHTML = `
                    <div class="reports-container">
                        <h3>❌ Error Loading Reports</h3>
                        <p>Failed to load financial reports. Please try again.</p>
                        <button class="btn" onclick="loadReports()">🔄 Retry</button>
                    </div>
                `;
            }
        }

        // Format date range for display
        function formatDateRange(dateRange) {
            if (!dateRange || !dateRange.from || !dateRange.to) return 'Custom Range';
            
            const fromDate = new Date(dateRange.from);
            const toDate = new Date(dateRange.to);
            
            if (dateRange.from === dateRange.to) {
                return fromDate.toLocaleDateString();
            } else {
                return `${fromDate.toLocaleDateString()} - ${toDate.toLocaleDateString()}`;
            }
        }

        function getReportTransactions() {
            return Array.isArray(currentReports?.detailRows?.transactions) ? currentReports.detailRows.transactions : [];
        }

        function getReportExpenses() {
            return Array.isArray(currentReports?.detailRows?.expenses) ? currentReports.detailRows.expenses : [];
        }

        function renderReportTileDetailTable(tileKey) {
            const transactions = getReportTransactions();
            const expenses = getReportExpenses();
            const title = getReportTileTitle(tileKey);

            if (tileKey === 'other-costs' || tileKey === 'total-costs' || tileKey === 'net-profit') {
                return renderReportExpenseTable(title, expenses, tileKey === 'net-profit' ? transactions : []);
            }

            if (tileKey === 'total-fees' || tileKey === 'base-fees' || tileKey === 'booking-credits') {
                return renderReportStaffPayTable(title, transactions);
            }

            const filteredTransactions = filterReportTransactions(tileKey, transactions);
            return renderReportTransactionTable(title, filteredTransactions);
        }

        function getReportTileTitle(tileKey) {
            const titles = {
                'total-revenue': 'Total Revenue source transactions',
                'total-transactions': 'All transactions',
                'average-transaction': 'Average transaction source rows',
                'total-fees': 'Total masseuse fee source rows',
                'net-profit': 'Net profit source rows',
                'revenue-total': 'Revenue breakdown source rows',
                'revenue-service': 'Service revenue source rows',
                'revenue-other': 'Other revenue source rows',
                'base-fees': 'Base massage fee rows',
                'booking-credits': 'Booking credit rows',
                'total-staff-pay': 'Total staff pay rows',
                'other-costs': 'Other cost rows',
                'total-costs': 'Total cost rows',
                'performance-transactions': 'Performance transaction rows'
            };
            if (tileKey.startsWith('payment-method:')) return `${tileKey.replace('payment-method:', '')} transactions`;
            if (tileKey.startsWith('service:')) return `${tileKey.replace('service:', '')} service rows`;
            if (tileKey.startsWith('staff:')) return `${tileKey.replace('staff:', '')} staff rows`;
            return titles[tileKey] || 'Source rows';
        }

        function filterReportTransactions(tileKey, transactions) {
            if (tileKey === 'revenue-other') return [];
            if (tileKey.startsWith('payment-method:')) {
                const method = tileKey.replace('payment-method:', '');
                return transactions.filter(transaction => transaction.payment_method === method);
            }
            if (tileKey.startsWith('service:')) {
                const service = tileKey.replace('service:', '');
                return transactions.filter(transaction => transaction.service_type === service);
            }
            if (tileKey.startsWith('staff:')) {
                const staff = tileKey.replace('staff:', '');
                return transactions.filter(transaction => transaction.masseuse_name === staff);
            }
            return transactions;
        }

        function renderReportTransactionTable(title, transactions) {
            const totals = transactions.reduce((sum, transaction) => {
                sum.revenue += Number(transaction.payment_amount || 0);
                sum.base += Number(transaction.masseuse_fee || 0);
                sum.booking += Number(transaction.booking_credit_amount || 0);
                return sum;
            }, { revenue: 0, base: 0, booking: 0 });

            if (transactions.length === 0) {
                return `<h4>${escapeReportHtml(title)}</h4><p>No source transactions for this tile.</p>`;
            }

            return `
                <h4>${escapeReportHtml(title)}</h4>
                <table class="report-detail-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Service</th>
                            <th>Staff</th>
                            <th>Payment</th>
                            <th>Revenue</th>
                            <th>Base</th>
                            <th>Booking</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transactions.map(transaction => `
                            <tr>
                                <td>${escapeReportHtml(formatReportTransactionTime(transaction))}</td>
                                <td>${escapeReportHtml(transaction.service_type || '')}</td>
                                <td>${escapeReportHtml(transaction.masseuse_name || '')}</td>
                                <td>${escapeReportHtml(transaction.payment_method || '')}</td>
                                <td>฿${Number(transaction.payment_amount || 0).toFixed(0)}</td>
                                <td>฿${Number(transaction.masseuse_fee || 0).toFixed(0)}</td>
                                <td>฿${Number(transaction.booking_credit_amount || 0).toFixed(0)}</td>
                            </tr>
                        `).join('')}
                        <tr class="report-detail-total-row">
                            <td colspan="4">Total</td>
                            <td>฿${totals.revenue.toFixed(0)}</td>
                            <td>฿${totals.base.toFixed(0)}</td>
                            <td>฿${totals.booking.toFixed(0)}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        function renderReportStaffPayTable(title, transactions) {
            return renderReportTransactionTable(title, transactions);
        }

        function renderReportExpenseTable(title, expenses, transactions = []) {
            const expenseTotal = expenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0);
            const revenueTotal = transactions.reduce((sum, transaction) => sum + Number(transaction.payment_amount || 0), 0);
            const payTotal = transactions.reduce((sum, transaction) => sum + Number(transaction.masseuse_fee || 0) + Number(transaction.booking_credit_amount || 0), 0);

            if (expenses.length === 0 && transactions.length === 0) {
                return `<h4>${escapeReportHtml(title)}</h4><p>No source rows for this tile.</p>`;
            }

            return `
                <h4>${escapeReportHtml(title)}</h4>
                <table class="report-detail-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transactions.length ? `
                            <tr>
                                <td>${escapeReportHtml(formatDateRange(currentReports.dateRange))}</td>
                                <td>Revenue</td>
                                <td>Total transaction revenue</td>
                                <td>฿${revenueTotal.toFixed(0)}</td>
                            </tr>
                            <tr>
                                <td>${escapeReportHtml(formatDateRange(currentReports.dateRange))}</td>
                                <td>Staff pay</td>
                                <td>Base fees plus booking credits</td>
                                <td>-฿${payTotal.toFixed(0)}</td>
                            </tr>
                        ` : ''}
                        ${expenses.map(expense => `
                            <tr>
                                <td>${escapeReportHtml(expense.date || '')}</td>
                                <td>${escapeReportHtml(expense.category || 'Expense')}</td>
                                <td>${escapeReportHtml(expense.description || '')}</td>
                                <td>-฿${Number(expense.amount || 0).toFixed(0)}</td>
                            </tr>
                        `).join('')}
                        <tr class="report-detail-total-row">
                            <td colspan="3">Total</td>
                            <td>฿${(revenueTotal - payTotal - expenseTotal).toFixed(0)}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        function formatReportTransactionTime(transaction) {
            const rawTime = transaction.start_time || transaction.timestamp || transaction.date || '';
            if (!rawTime) return '';
            const parsed = new Date(rawTime);
            if (Number.isNaN(parsed.getTime())) return rawTime;
            return parsed.toLocaleString();
        }

        // Display financial reports
        function displayReports() {
            console.log('🎨 displayReports() called');
            
            if (!currentReports) {
                console.log('❌ No currentReports data, returning');
                return;
            }

            if (!currentReports.summary) {
                console.log('❌ No summary data in currentReports, returning');
                return;
            }

            console.log('📊 Processing reports data...');
            
            // Hide loading indicator
            document.getElementById('loading-indicator').style.display = 'none';
            
            // Update summary cards with safe data access
            const summary = currentReports.summary;
            document.getElementById('total-revenue').textContent = `฿${(summary.total_revenue || 0).toFixed(0)}`;
            document.getElementById('total-transactions').textContent = summary.total_transactions || 0;
            document.getElementById('avg-transaction').textContent = `฿${(summary.average_transaction || 0).toFixed(0)}`;
            document.getElementById('total-fees').textContent = `฿${(summary.total_masseuse_fees || 0).toFixed(0)}`;
            document.getElementById('net-profit').textContent = `฿${(summary.net_profit || 0).toFixed(0)}`;

            // Build reports HTML
            let reportsHTML = `
                <div class="reports-container">
                    <h3>📊 Financial Summary (${escapeReportHtml(formatDateRange(currentReports.dateRange))})</h3>
                    
                    <div class="report-grid">
                        <div class="report-section">
                            <h4>💰 Revenue Breakdown</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="revenue-total" aria-expanded="false">
                                <span class="label">Total Revenue:</span>
                                <span class="value positive">฿${(currentReports.summary.total_revenue || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="revenue-service" aria-expanded="false">
                                <span class="label">Service Revenue:</span>
                                <span class="value">฿${(currentReports.summary.serviceRevenue || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="revenue-other" aria-expanded="false">
                                <span class="label">Other Revenue:</span>
                                <span class="value">฿${(currentReports.summary.otherRevenue || 0).toFixed(0)}</span>
                            </div>
                        </div>
                        
                        <div class="report-section">
                            <h4>💸 Cost Breakdown</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="base-fees" aria-expanded="false">
                                <span class="label">ค่าแรงนวด:</span>
                                <span class="value negative">฿${(currentReports.summary.baseFees || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="booking-credits" aria-expanded="false">
                                <span class="label">ค่าจองพนักงาน:</span>
                                <span class="value negative">+฿${(currentReports.summary.bookingCredits || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="total-staff-pay" aria-expanded="false">
                                <span class="label">ค่าแรงรวม:</span>
                                <span class="value negative">฿${(currentReports.summary.totalFees || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="other-costs" aria-expanded="false">
                                <span class="label">Other Costs:</span>
                                <span class="value negative">฿${(currentReports.summary.otherCosts || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="total-costs" aria-expanded="false">
                                <span class="label">Total Costs:</span>
                                <span class="value negative">฿${(currentReports.summary.totalCosts || 0).toFixed(0)}</span>
                            </div>
                        </div>
                        
                        <div class="report-section">
                            <h4>📈 Performance Metrics</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="net-profit" aria-expanded="false">
                                <span class="label">Net Profit:</span>
                                <span class="value ${(currentReports.summary.net_profit || 0) >= 0 ? 'positive' : 'negative'}">฿${(currentReports.summary.net_profit || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item">
                                <span class="label">Profit Margin:</span>
                                <span class="value">${(currentReports.summary.profit_margin || 0).toFixed(1)}%</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="performance-transactions" aria-expanded="false">
                                <span class="label">Transactions:</span>
                                <span class="value">${currentReports.summary.total_transactions || 0}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Add payment type breakdown section - NEW FEATURE
            if (currentReports.breakdowns && currentReports.breakdowns.by_payment_method && currentReports.breakdowns.by_payment_method.length > 0) {
                reportsHTML += `
                    <div class="reports-container">
                        <h3>💳 Payment Type Breakdown - Account Verification</h3>
                        <p style="color: #6c757d; margin-bottom: 15px; font-style: italic;">Verify your accounts by checking the expected amounts below:</p>
                        <div class="report-grid">
                `;
                
                currentReports.breakdowns.by_payment_method.forEach(paymentType => {
                    reportsHTML += `
                        <div class="report-section">
                            <h4>${escapeReportHtml(paymentType.payment_method)}</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="payment-method:${escapeReportHtml(paymentType.payment_method || '')}" aria-expanded="false">
                                <span class="label">Revenue:</span>
                                <span class="value positive">฿${(paymentType.revenue || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="payment-method:${escapeReportHtml(paymentType.payment_method || '')}" aria-expanded="false">
                                <span class="label">Transactions:</span>
                                <span class="value">${paymentType.count || 0}</span>
                            </div>
                            <div class="report-item">
                                <span class="label">Percentage:</span>
                                <span class="value">${currentReports.summary.total_revenue > 0 ? ((paymentType.revenue / currentReports.summary.total_revenue) * 100).toFixed(1) : '0'}%</span>
                            </div>
                        </div>
                    `;
                });
                
                reportsHTML += `
                        </div>
                    </div>
                `;
            }

            // Add service breakdown if available
            if (currentReports.serviceBreakdown && currentReports.serviceBreakdown.length > 0) {
                reportsHTML += `
                    <div class="reports-container">
                        <h3>🔧 Service Performance</h3>
                        <div class="report-grid">
                `;
                
                currentReports.serviceBreakdown.forEach(service => {
                    reportsHTML += `
                        <div class="report-section">
                            <h4>${escapeReportHtml(service.serviceName)}</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="service:${escapeReportHtml(service.serviceName || '')}" aria-expanded="false">
                                <span class="label">Revenue:</span>
                                <span class="value positive">฿${(service.revenue || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="service:${escapeReportHtml(service.serviceName || '')}" aria-expanded="false">

                                <span class="value">${service.transactions || 0}</span>
                            </div>
                            <div class="report-item">
                                <span class="label">Avg. Price:</span>
                                <span class="value">฿${service.transactions && service.revenue ? ((service.revenue / service.transactions) || 0).toFixed(0) : '0'}</span>
                            </div>
                        </div>
                    `;
                });
                
                reportsHTML += `
                        </div>
                    </div>
                `;
            }

            // Add staff performance if available
            if (currentReports.staffBreakdown && currentReports.staffBreakdown.length > 0) {
                reportsHTML += `
                    <div class="reports-container">
                        <h3>👥 Staff Performance</h3>
                        <div class="report-grid">
                `;
                
                currentReports.staffBreakdown.forEach(staff => {
                    reportsHTML += `
                        <div class="report-section">
                            <h4>${escapeReportHtml(staff.staffName)}</h4>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="staff:${escapeReportHtml(staff.staffName || '')}" aria-expanded="false">
                                <span class="label">Services:</span>
                                <span class="value">${staff.services || 0}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="staff:${escapeReportHtml(staff.staffName || '')}" aria-expanded="false">
                                <span class="label">ค่าแรงนวด:</span>
                                <span class="value positive">฿${(staff.baseFees || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="staff:${escapeReportHtml(staff.staffName || '')}" aria-expanded="false">
                                <span class="label">ค่าจองพนักงาน:</span>
                                <span class="value positive">+฿${(staff.bookingCredits || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item" role="button" tabindex="0" data-report-tile="staff:${escapeReportHtml(staff.staffName || '')}" aria-expanded="false">
                                <span class="label">ค่าแรงรวม:</span>
                                <span class="value positive">฿${(staff.totalStaffPay || 0).toFixed(0)}</span>
                            </div>
                            <div class="report-item">
                                <span class="label">Avg. Rating:</span>
                                <span class="value">${staff.averageRating ? (staff.averageRating || 0).toFixed(1) + '⭐' : 'N/A'}</span>
                            </div>
                        </div>
                    `;
                });
                
                reportsHTML += `
                        </div>
                    </div>
                `;
            }

            // Add chart placeholders
            reportsHTML += `
                <div class="chart-container">
                    <h3>📈 Revenue Trends</h3>
                    <div class="chart-placeholder">
                        <h4>📊 Chart Visualization</h4>
                        <p>Interactive charts and graphs will be implemented in future versions.</p>
                        <p>Currently showing data for: ${escapeReportHtml(formatDateRange(currentReports.dateRange))}</p>
                    </div>
                </div>
            `;

            // Display the reports
            document.getElementById('reports-container').innerHTML = reportsHTML;
            document.getElementById('reports-container').style.display = 'block';
            setupReportTileToggles(document.getElementById('reports-container'));
        }

        // Export report functions
        function exportReport(format) {
            if (!currentReports) {
                showToast('No reports to export. Please load reports first.', 'error');
                return;
            }
            
            if (format === 'csv') {
                exportToCSV();
            }
        }

        function exportToCSV() {
            const rows = [
                ['Section', 'Name', 'Revenue', 'Count', 'Fees', 'Percentage'],
                ['Summary', 'Total Revenue', currentReports.summary.total_revenue || 0, currentReports.summary.total_transactions || 0, currentReports.summary.total_masseuse_fees || 0, ''],
                ['Summary', 'Net Profit', currentReports.summary.net_profit || 0, '', '', `${currentReports.summary.profit_margin || 0}%`]
            ];

            (currentReports.breakdowns?.by_payment_method || []).forEach(row => {
                rows.push(['Payment Method', row.payment_method || '', row.revenue || 0, row.count || 0, '', '']);
            });

            (currentReports.serviceBreakdown || []).forEach(row => {
                rows.push(['Service', row.serviceName || '', row.revenue || 0, row.transactions || 0, '', '']);
            });

            (currentReports.staffBreakdown || []).forEach(row => {
                rows.push(['Staff', row.staffName || '', row.revenue || 0, row.services || 0, row.feesEarned || 0, '']);
            });

            const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `financial-report-${currentReports.dateRange?.from || 'from'}-${currentReports.dateRange?.to || 'to'}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            showToast('CSV export generated', 'success');
        }

        function printReport() {
            if (!currentReports) {
                showToast('No reports to print. Please load reports first.', 'error');
                return;
            }
            
            window.print();
        }

        // Set default date range to today
        function setDefaultDates() {
            const today = new Date();
            document.getElementById('date-from').value = today.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];
        }

        // Initialize default dates
        setDefaultDates();
    </script>
